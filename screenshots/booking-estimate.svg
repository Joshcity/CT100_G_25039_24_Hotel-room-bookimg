<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="#f8f7f2"/><rect width="1280" height="72" fill="#fbfaf7"/><text x="88" y="42" font-family="Arial" font-weight="bold" letter-spacing="2" fill="#193a36">◉ SUNRISE</text><text x="520" y="43" font-family="Arial" font-size="13" fill="#53635d">Home　　 Rooms &amp; booking　　 Our experience</text><text x="560" y="125" font-family="Arial" font-size="10" letter-spacing="2" fill="#74817b">— YOUR COASTAL ESCAPE</text><text x="520" y="183" font-family="Georgia" font-size="46" fill="#193a36">Make it <tspan font-style="italic" fill="#ad8d63">yours.</tspan></text><text x="470" y="215" font-family="Arial" font-size="12" fill="#82908a">Tell us a little about your stay. We'll take care of the rest.</text><rect x="110" y="250" width="700" height="600" fill="white" stroke="#e9e7df"/><text x="145" y="290" font-family="Georgia" font-size="20" fill="#193a36">01　Your details</text><text x="145" y="314" font-family="Arial" font-size="11" fill="#82908a">Who should we welcome?</text><g font-family="Arial" font-size="11" fill="#455953"><text x="145" y="355">FULL NAME</text><text x="500" y="355">NATIONAL ID / PASSPORT</text><text x="145" y="440">EMAIL ADDRESS</text><text x="500" y="440">PHONE NUMBER</text><text x="145" y="525">CHECK-IN DATE</text><text x="500" y="525">NUMBER OF NIGHTS</text><text x="145" y="610">ROOM TYPE</text><text x="500" y="610">NUMBER OF GUESTS</text></g><g fill="white" stroke="#dfe2da"><rect x="145" y="365" width="625" height="42"/><rect x="145" y="450" width="300" height="42"/><rect x="475" y="450" width="295" height="42"/><rect x="145" y="535" width="300" height="42"/><rect x="475" y="535" width="295" height="42"/><rect x="145" y="620" width="300" height="42"/><rect x="475" y="620" width="295" height="42"/></g><g font-family="Arial" font-size="12" fill="#193a36"><text x="160" y="392">Amina Hassan</text><text x="160" y="477">amina@example.com</text><text x="490" y="477">0712345678</text><text x="160" y="562">2026-11-05</text><text x="490" y="562">3</text><text x="160" y="647">Double Room · KSh 5,000/night</text><text x="490" y="647">2</text></g><text x="145" y="701" font-family="Georgia" font-size="20" fill="#193a36">03　Make it special</text><text x="160" y="740" font-family="Arial" font-size="12" fill="#193a36">☑ Breakfast, please　　KSh 700 per guest, per day</text><text x="160" y="778" font-family="Arial" font-size="12" fill="#193a36">☑ Airport transfer　　+ KSh 2,000</text><text x="160" y="816" font-family="Arial" font-size="12" fill="#193a36">☑ Late checkout · requirement 9　　+ KSh 2,000</text><rect x="850" y="250" width="320" height="600" fill="#193a36"/><text x="875" y="288" font-family="Arial" font-size="9" letter-spacing="2" fill="#d9ded8">— YOUR STAY, AT A GLANCE</text><text x="875" y="330" font-family="Georgia" font-size="25" fill="white">A stay to look forward to.</text><rect x="875" y="350" width="270" height="155" fill="url(#s)"/><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#dfb27d"/><stop offset=".42" stop-color="#e8c99d"/><stop offset=".43" stop-color="#76928d"/><stop offset="1" stop-color="#153b3b"/></linearGradient></defs><circle cx="1010" cy="405" r="28" fill="#f5dfb6"/><g font-family="Arial" font-size="10" fill="#e8eee9"><text x="880" y="555">ROOM</text><text x="1070" y="555">Double Room</text><text x="880" y="598">STAY</text><text x="1070" y="598">3 nights · 2 guests</text><text x="880" y="641">CAPACITY</text><text x="1070" y="641">Up to 2 guests</text></g><rect x="850" y="690" width="320" height="160" fill="#12312e"/><text x="875" y="730" font-family="Arial" font-size="9" letter-spacing="2" fill="#aab8b0">ESTIMATED TOTAL</text><text x="1015" y="770" font-family="Georgia" font-size="27" fill="#e0c598">KSh 21,700</text><text x="875" y="810" font-family="Arial" font-size="10" fill="#aab8b0">Final amount confirmed on submission.</text></svg>
